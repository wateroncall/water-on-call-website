name: Website checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node --check src/index.js && node --check src/customer-overlay.js && node --check src/booking-tools.js && node --check src/waitlist-confirmation.js && node --check src/marketing.js
      - run: npx wrangler deploy --dry-run --outdir test-artifacts/bundle
      - run: npm test
        env:
          WEBSITE_WORKER_ENTRY: test-artifacts/bundle/customer-overlay.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-screenshots
          path: test-artifacts/*.png


