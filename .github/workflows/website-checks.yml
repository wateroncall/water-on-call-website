name: Website checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node --check src/index.js && node --check src/customer-overlay.js && node --check src/booking-tools.js
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-screenshots
          path: test-artifacts/*.png
