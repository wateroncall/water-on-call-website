name: Live public website Analytics diagnosis
on:
  pull_request:
    paths: ['tests/analytics-live.cjs', '.github/workflows/analytics-live.yml']
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node tests/analytics-live.cjs
        env:
          GA_USE_CANDIDATE_CSP: '1'
