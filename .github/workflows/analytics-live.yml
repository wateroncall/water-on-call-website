name: Live public website Analytics diagnosis
on:
  pull_request:
    paths: ['src/customer-overlay.js', 'src/marketing.js', 'tests/analytics-live.cjs', '.github/workflows/analytics-live.yml']
  push:
    branches: [main]
    paths: ['src/customer-overlay.js', 'src/marketing.js', 'tests/analytics-live.cjs', '.github/workflows/analytics-live.yml']
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node tests/analytics-live.cjs
        env:
          GA_USE_CANDIDATE_CSP: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          GA_WAIT_FOR_DEPLOY: ${{ github.event_name == 'push' && '1' || '0' }}

